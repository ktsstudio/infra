services:
  server:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    environment:
      - INFRA_SERVER_TLS_CA=/work/internal/server/testdata/pki/ca.crt
      - INFRA_SERVER_TLS_CA_PRIVATE_KEY=/work/internal/server/testdata/pki/ca.key
      - INFRA_SERVER_DB_CONNECTION_STRING=host=db port=5432 user=postgres dbname=postgres password=postgres
      - INFRA_SERVER_DB_ENCRYPTION_KEY=/work/test/root.key
    command: /work/dist/infra_linux_amd64_v1/infra server --config-file /work/test/dockerfiles/server.yaml
    volumes:
      - ..:/work
    ports:
      - "127.0.0.1:4443:443"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    command: postgres -c fsync=off -c full_page_writes=off -c max_connections=100
    user: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  destination_ubuntu:
    build:
      context: ./test
      dockerfile: dockerfiles/Dockerfile.debian
      args:
        image_tag: ubuntu:26.10@sha256:262df65c0ec6bf8d9dcc87454f4330a05fae4b97825f45854af3b136666584c2
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ..:/work
    privileged: true
    depends_on: [server]
    ports: ["127.0.0.1:8220:22"]

  destination_debian:
    build:
      context: ./test
      dockerfile: dockerfiles/Dockerfile.debian
      args:
        image_tag: debian:13.7-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    volumes:
      - ..:/work
    privileged: true
    depends_on: [server]
    stop_grace_period: 1s
    ports: ["127.0.0.1:8221:22"]

  destination_redhat:
    build:
      context: ./test
      dockerfile: dockerfiles/Dockerfile.redhat
    volumes:
      - ..:/work
    privileged: true
    depends_on: [server]
    stop_grace_period: 1s
    ports: ["127.0.0.1:8222:22"]
