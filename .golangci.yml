version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
  settings:
    govet:
      disable: [inline]
    staticcheck:
      # Bug and security diagnostics; omit optional style and quick-fix rules.
      checks: ["SA*"]
  exclusions:
    rules:
      # Transaction cleanup is best effort after Commit or a prior failure.
      - linters: [errcheck]
        text: "tx\\.Rollback"
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
