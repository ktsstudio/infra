name: ci / core
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - run: make lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Use PostgreSQL tools matching the test server
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg-bin"
          cat > "$RUNNER_TEMP/pg-bin/pg_dump" <<'EOF'
          #!/usr/bin/env bash
          exec docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER -e PGPASSWORD -e PGDATABASE "$PG_DUMP_CONTAINER" pg_dump "$@"
          EOF
          chmod +x "$RUNNER_TEMP/pg-bin/pg_dump"
          echo "PG_DUMP_CONTAINER=$POSTGRES_CONTAINER" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pg-bin" >> "$GITHUB_PATH"
      - run: go mod download
      - run: go test -race ./...
        env:
          POSTGRESQL_CONNECTION: host=localhost port=5432 user=postgres dbname=postgres password=test-only-password sslmode=disable
      - name: Query builder linter tests
        working-directory: internal/tools/querylinter
        run: go test ./...
      - name: Verify dependency manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - run: GOTOOLCHAIN="$(go env GOVERSION)" go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=package ./...
      - name: Verify OpenPGP vulnerable code is absent on every supported platform
        run: |
          set -euo pipefail
          for target_os in linux darwin windows; do
            for target_arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go list -deps . > "$RUNNER_TEMP/infra-deps-$target_os-$target_arch.txt"
              if grep -Eq '^golang.org/x/crypto/openpgp(/|$)' "$RUNNER_TEMP/infra-deps-$target_os-$target_arch.txt"; then
                echo "OpenPGP is now imported: the not_affected VEX statement is no longer valid"
                exit 1
              fi
            done
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Install patched npm build tooling
        run: sh ui/scripts/install-npm-toolchain.sh
      - name: Audit local JavaScript actions
        run: |
          for action in .github/actions/*; do
            (cd "$action" && npm ci --ignore-scripts && npm audit && npm run lint && npm run prepare)
          done
